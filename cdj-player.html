<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CDJ Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { overflow: hidden; scrollbar-width: none; }
    :root::-webkit-scrollbar, html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }

    body {
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      color: #fff;
      cursor: default;
      user-select: none;
    }

    #canvas-3d { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }

    #usb-hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      transition: opacity 0.6s;
      z-index: 20;
    }
    #usb-hint.hidden { opacity: 0; }
    #usb-hint p {
      font-size: 10px;
      color: #ffffff;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    @keyframes pulse-hint { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

    #state-panel {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 20;
      pointer-events: none;
    }

    .state-pill {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 1px solid #1a5c2a;
      color: #1a5c2a;
      transition: all 0.2s;
    }
    .state-pill.active { color: #00ff41; border-color: #00ff41; box-shadow: 0 0 8px rgba(0,255,65,0.4); }

    #deck-scroll, #deck-scroll-thumb { display: none; }

    #debug-panel { position: fixed; top: 10px; right: 10px; font-size: 9px; color: #333; letter-spacing: 1px; z-index: 30; line-height: 1.8; display: none; }
    #debug-panel.visible { display: block; color: #00ff41; }
    #debug-toggle { display: none; }
    #debug-panel { display: none !important; }

    #file-input { display: none; }

    #cue-flash { position: fixed; inset: 0; background: rgba(0,255,65,0.04); pointer-events: none; opacity: 0; z-index: 5; transition: opacity 0.1s; }

    #loading-screen {
      position: fixed; inset: 0; background: #000; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; transition: opacity 0.5s;
    }
    #loading-screen.hidden { opacity: 0; }
    #loading-screen p { font-size: 9px; letter-spacing: 5px; color: #1a5c2a; animation: pulse-hint 1.2s ease-in-out infinite; }

    /* ── Track Browser Panel ── */
    #track-panel {
      position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: flex-start;
      padding-top: 120px; padding-left: 470px;
      z-index: 50; background: rgba(0,0,0,0.75);
      opacity: 0; pointer-events: none; transition: opacity 0.6s;
    }
    #track-panel.open { opacity: 1; pointer-events: all; }
    #track-panel-inner {
      width: 460px; max-height: 72vh; background: #000;
      border: 1px solid #ffffff; display: flex; flex-direction: column;
      box-shadow: 0 0 60px rgba(255,255,255,0.06);
    }
    #track-panel-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; border-bottom: 1px solid #ffffff;
      font-size: 9px; letter-spacing: 4px; color: #00ff41;
      cursor: grab;
    }
    #track-panel-header:active { cursor: grabbing; }
    #track-panel-close {
      background: none; border: 1px solid #ffffff; color: #ffffff;
      cursor: pointer; font-size: 11px; padding: 2px 7px; letter-spacing: 0;
      transition: all 0.15s;
    }
    #track-panel-close:hover { color: #00ff41; border-color: #00ff41; }
    #track-search {
      background: #000; border: none; border-bottom: 1px solid #ffffff;
      color: #fff; font-family: inherit; font-size: 9px; letter-spacing: 3px;
      padding: 12px 18px; outline: none; text-transform: uppercase; width: 100%;
    }
    #track-search::placeholder { color: #666; }
    #track-list { overflow-y: auto; height: 292px; min-height: 292px; max-height: 292px; }
    #track-list::-webkit-scrollbar { width: 2px; }
    #track-list::-webkit-scrollbar-thumb { background: #ffffff; }
    .track-item {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 14px; border-bottom: 1px solid #1a1a1a; cursor: pointer;
      transition: background 0.12s; border-left: 2px solid transparent;
    }
    .track-item:hover { background: #0d0d0d; }
    .track-item.active { border-left-color: #00ff41; }
    .track-art {
      width: 52px; height: 52px; flex-shrink: 0;
      background: #0a0a0a; border: 1px solid #ffffff;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .track-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .track-art-placeholder {
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        45deg, #1a1a1a 0px, #1a1a1a 4px, #000 4px, #000 8px
      );
    }
    .track-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .track-dj { font-size: 8px; letter-spacing: 2px; color: #00ff41; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track-title { font-size: 9px; letter-spacing: 1.5px; color: #ffffff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .track-item.active .track-title { color: #fff; }
    .track-item-dur { font-size: 8px; color: #aaa; letter-spacing: 1px; flex-shrink: 0; align-self: center; }
    #track-empty { padding: 28px 18px; font-size: 9px; letter-spacing: 3px; color: #888; text-align: center; }
    #track-add-btn {
      display: block; text-align: center; padding: 13px 18px; font-size: 9px;
      letter-spacing: 3px; color: #ffffff; border-top: 1px solid #ffffff;
      cursor: pointer; transition: color 0.15s; text-transform: uppercase;
    }
    #track-add-btn:hover { color: #00ff41; }
    #track-file-input { display: none; }

    /* ── Press Play Hint ── */

    @keyframes labelPulse {
      0%, 100% { opacity: 1;   text-shadow: 0 0 10px rgba(0,255,65,0.9), 0 0 24px rgba(0,255,65,0.5); }
      50%       { opacity: 0.4; text-shadow: 0 0 5px rgba(0,255,65,0.4), 0 0 12px rgba(0,255,65,0.15); }
    }
    .deck-label {
      position: fixed; z-index: 20; pointer-events: none;
      font-size: 9px; letter-spacing: 2px; color: #00ff41;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      white-space: nowrap; opacity: 0;
      transition: opacity 2s ease;
      text-shadow: 0 0 8px rgba(0,255,65,0.7), 0 0 18px rgba(0,255,65,0.3);
    }
    .deck-label.fadein { opacity: 1; }
    .deck-label.pulsing {
      transition: none;
      opacity: 1;
      animation: labelPulse 2.4s ease-in-out infinite;
    }
  </style>
</head>
<body>

<div id="loading-screen"><p>LOADING</p></div>
<div class="deck-label" id="lbl-play">[PLAY]</div>
<div class="deck-label" id="lbl-cue">[CUE]</div>
<div class="deck-label" id="lbl-track">[TRACK SEARCH]</div>
<div class="deck-label pulsing" id="lbl-usb" style="pointer-events:auto;cursor:grab">[ESR USB]</div>
<canvas id="canvas-3d"></canvas>
<div id="cue-flash"></div>
<div id="debug-panel"></div>
<div id="debug-toggle">[debug]</div>
<div id="usb-hint" style="display:none"><p>click usb to load track</p></div>

<div id="state-panel" style="display:none">
  <div class="state-pill" id="pill-play">PLAY</div>
  <div class="state-pill" id="pill-cue">CUE</div>
  <div class="state-pill" id="pill-scratch">SCRATCH</div>
</div>


<div id="deck-scroll"><div id="deck-scroll-thumb"></div></div>
<input type="file" id="file-input" accept="audio/*">

<div id="track-panel">
  <div id="track-panel-inner">
    <div id="track-panel-header">
      <div>
        <div style="font-size:10px;letter-spacing:4px;color:#00ff41;">ESR USB</div>
        <div style="font-size:7px;letter-spacing:2px;color:#888;margin-top:4px;">SELECT A TRACK AND PRESS PLAY BUTTON ON THE DECK</div>
      </div>
      <button id="track-panel-close">✕</button>
    </div>
    <input id="track-search" type="text" placeholder="SEARCH TRACKS..." autocomplete="off" spellcheck="false">
    <div id="track-list"><div id="track-empty">NO TRACKS — CLICK + ADD TRACKS</div></div>
    <div id="track-status" style="display:none;"></div>
  </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
'use strict';

// ── Renderer ──
const canvas3d = document.getElementById('canvas-3d');
const renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);

// ── Crop mode ──────────────────────────────────────────────────────────────
// Load via: cdj-player.html?crop=nx,ny,nw,nh,ar
// nx/ny = normalised top-left, nw/nh = normalised size, ar = original aspect ratio
const _urlP  = new URLSearchParams(window.location.search);
const CROP_MODE = _urlP.has('crop');
const _crop  = { nx:0, ny:0, nw:1, nh:1, ar:16/9 };
if (CROP_MODE) {
  const v = (_urlP.get('crop') || '').split(',').map(Number);
  if (v.length >= 5) { _crop.nx=v[0]; _crop.ny=v[1]; _crop.nw=v[2]; _crop.nh=v[3]; _crop.ar=v[4]; }
}
function _applyCrop() {
  if (!CROP_MODE) return;
  const W = window.innerWidth, H = window.innerHeight;
  // Use setViewOffset so Three.js renders ONLY the rectangle region.
  // Labels project through this camera and land in the correct position automatically.
  const fullW = W / _crop.nw;
  const fullH = H / _crop.nh;
  camera.setViewOffset(fullW, fullH, _crop.nx * fullW, _crop.ny * fullH, W, H);
  camera.aspect = fullW / fullH;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
}
// ──────────────────────────────────────────────────────────────────────────
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;

// Clip right CDJ — applied per-material so underglow/sprites are unaffected
const clipX = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0.51);
renderer.localClippingEnabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(-0.027, 2.2, 3.8);

const orbit = new THREE.OrbitControls(camera, canvas3d);
orbit.enableDamping = true;
orbit.dampingFactor = 0.06;
orbit.minDistance = 2;
orbit.maxDistance = 10;
orbit.maxPolarAngle = Math.PI * 0.52;
orbit.minPolarAngle = Math.PI * 0.1;
orbit.target.set(-0.027, 0.24, 0.1);
orbit.enablePan    = false;
orbit.enableRotate = false;
orbit.enableZoom   = false;
orbit.enabled      = false;

// ── Lighting ──
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
keyLight.position.set(4, 8, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.setScalar(2048);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xaaccff, 0.4);
fillLight.position.set(-4, 3, -2);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0x00ff41, 0.3);
rimLight.position.set(0, -1, -4);
scene.add(rimLight);
const greenGlow = new THREE.PointLight(0x00ff41, 0.6, 8);
greenGlow.position.set(0, 1.5, 2);
scene.add(greenGlow);


// Underglow — flat horizontal plane just below the deck, radial glow peeks around the edges
{ const _bc = document.createElement('canvas'); _bc.width = 256; _bc.height = 256;
  const _bx = _bc.getContext('2d');
  const _br = _bx.createRadialGradient(128,128,10, 128,128,128);
  _br.addColorStop(0,   'rgba(255,255,255,0.35)');
  _br.addColorStop(0.5, 'rgba(255,255,255,0.12)');
  _br.addColorStop(1,   'rgba(255,255,255,0)');
  _bx.fillStyle = _br; _bx.fillRect(0,0,256,256);
  const _bg = new THREE.Mesh(
    new THREE.PlaneGeometry(2.6, 2.2),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(_bc), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide })
  );
  _bg.rotation.x = -Math.PI / 2;
  _bg.position.set(-0.027, 0.27, 0.10);
  _bg.visible = true;
  scene.add(_bg);
}


// ── State ──
const state = {
  trackLoaded: false, playing: false,
  audioBuffer: null, audioCtx: null, sourceNode: null, gainNode: null,
  startTime: 0, pauseOffset: 0, cuePoint: 0, duration: 0,
  waveformData: null, usbInserted: false,
  jogDragging: false,
  jogStartX: 0, jogStartOffset: 0,
  jogRotation: 0,       // cumulative rotation in cycles
  jogVelocity: 0,       // cycles/sec right now
  jogEngaged: false,      // true while dragging OR coasting on inertia
  jogAudioPos: 0,         // audio position we're scrubbing to (seconds) — integrated each frame
  jogWasPlaying: false,   // was audio playing before jog engaged
  jogLastBackSeek: 0,     // timestamp of last backward seek (ms)
  jogPrevX: 0, jogPrevTime: 0,
  playbackRate: 1.0, debugMode: false,
};

const btnState = {
  play: { pressed: false, yBase: 0 },
  cue:  { pressed: false, yBase: 0 },
};
let heldButton = null;
const DEPRESS_Y = 0.022;
const BTN_GLOW  = 3.5;

// ── CDJ Screen ──────────────────────────────────────────────────────────────
const SCR_CW = 512, SCR_CH = 320;
const screenCanvas = document.createElement('canvas');
screenCanvas.width = SCR_CW; screenCanvas.height = SCR_CH;
const screenCtx = screenCanvas.getContext('2d');
const screenTexture = new THREE.CanvasTexture(screenCanvas);
screenTexture.minFilter = THREE.LinearFilter;
screenTexture.magFilter = THREE.LinearFilter;
let screenMesh = null;
let waveformPeaks = null;
let artworkImage = null;
let trackFadeAlpha = 1;   // 0→1 fade when track loads
let trackFadeStart = null;
const TRACK_FADE_MS = 300;

// Zones on 512×320 canvas
const SCR_Z = {
  heading:  { x:82,  y:8,   w:425, h:64  },
  waveform: { x:109, y:126, w:310, h:62  },
  time:     { x:322, y:283, w:134, h:37  },
  miniwave: { x:200, y:293, w:124, h:19  },
  artwork:  { x:5,   y:5,   w:75,  h:91  },
  esr:      { x:77,  y:38,  w:387, h:216 },
};

// Screen quad — locked corners matching CDJ screen face (tilted, not horizontal)
const SCR_CORNERS = [
  [-0.3471, 0.4518, -0.5550], // TL
  [ 0.2933, 0.4506, -0.5483], // TR
  [ 0.2949, 0.3871, -0.1889], // BR
  [-0.3489, 0.3871, -0.1889], // BL
];

function buildScreenQuad() {
  const positions = new Float32Array(4 * 3);
  const uvs = new Float32Array([0,1, 1,1, 1,0, 0,0]);
  SCR_CORNERS.forEach(([x,y,z], i) => { positions[i*3]=x; positions[i*3+1]=y; positions[i*3+2]=z; });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.setIndex([0,2,1, 0,3,2]);
  const mat = new THREE.MeshBasicMaterial({ map: screenTexture, side: THREE.DoubleSide, depthTest: false });
  screenMesh = new THREE.Mesh(geo, mat);
  screenMesh.renderOrder = 100;
  scene.add(screenMesh);
  drawScreen();
}

function buildScreenPlane() { buildScreenQuad(); }

function computeWaveformPeaks(buffer) {
  const ch = buffer.getChannelData(0);
  const cols = 4000; // high resolution for smooth zoomed scrolling
  const block = Math.floor(ch.length / cols);
  waveformPeaks = new Float32Array(cols);
  for (let i = 0; i < cols; i++) {
    let max = 0;
    const s = i * block;
    for (let j = 0; j < block; j++) { const v = Math.abs(ch[s + j]); if (v > max) max = v; }
    waveformPeaks[i] = Math.pow(max, 0.6); // power curve — lifts quiet transients, compresses loud peaks
  }
}

// ii logo — default artwork placeholder
const esrPlaceholder = new Image();
esrPlaceholder.src = 'assets/asset-f5abc9f1.png';
esrPlaceholder.onload = () => { if (screenMesh) drawScreen(); };

function cacheArtwork(track) {
  if (!track || !track.artwork) { artworkImage = null; return; }
  const img = new Image();
  img.onload = () => { artworkImage = img; drawScreen(); };
  img.src = track.artwork;
}

function drawScreen() {
  if (!screenCtx) return;
  const ctx = screenCtx;
  const z = SCR_Z;

  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, SCR_CW, SCR_CH);

  // Advance fade-in
  if (trackFadeStart !== null) {
    trackFadeAlpha = Math.min(1, (performance.now() - trackFadeStart) / TRACK_FADE_MS);
    if (trackFadeAlpha < 1) screenTexture.needsUpdate = true; // keep redrawing until complete
  }
  ctx.globalAlpha = trackFadeAlpha;

  const loaded = state.trackLoaded;
  const t = loaded && activeTrackIdx >= 0 ? trackLibrary[activeTrackIdx] : null;

  // ── TOP HEADING ──
  ctx.fillStyle = '#000000';
  ctx.fillRect(z.heading.x, z.heading.y, z.heading.w, z.heading.h);
  if (t) {
    ctx.fillStyle = '#e0e8ff';
    ctx.font = 'bold 16px monospace';
    ctx.textBaseline = 'middle';
    ctx.fillText(t.djName + ' - ' + t.trackTitle, z.heading.x + 8, z.heading.y + z.heading.h / 2);
  }

  // ── WAVEFORM MAIN (scrolling zoomed view) ──
  const pos = loaded ? getPos() : 0;
  const dur = loaded ? state.duration : 1;
  const playPct = Math.min(1, pos / Math.max(dur, 0.001));
  if (waveformPeaks) {
    const wz = z.waveform;
    const mid = wz.y + wz.h / 2;
    const totalSamples = waveformPeaks.length; // == SCR_CW
    // How many seconds the main window shows (zoom level)
    const WINDOW_SECS = 6;
    const samplesPerSec = totalSamples / Math.max(dur, 0.001);
    const windowSamples = WINDOW_SECS * samplesPerSec;
    const playSample = playPct * totalSamples;
    for (let x = 0; x < wz.w; x++) {
      // Playhead at left edge — show windowSamples of upcoming audio to the right
      const sampleIdx = Math.round(playSample + (x / wz.w) * windowSamples);
      if (sampleIdx < 0 || sampleIdx >= totalSamples) continue;
      const peak = waveformPeaks[sampleIdx];
      const h = Math.max(1, peak * wz.h * 0.88);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(wz.x + x, mid - h / 2, 1, h);
    }
    // Fixed left-edge playhead line
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(wz.x, wz.y, 2, wz.h);
  }
  // underline — always fully visible regardless of fade
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(z.waveform.x, z.waveform.y + z.waveform.h + 2, z.waveform.w, 3);
  ctx.globalAlpha = trackFadeAlpha;

  // ── TRACK TIME ──
  {
    const tz = z.time;
    ctx.fillStyle = '#000000';
    ctx.fillRect(tz.x - 2, tz.y - 2, tz.w + 4, tz.h + 4);
    const m   = Math.floor(pos / 60);
    const s   = Math.floor(pos % 60);
    const str = m.toString() + ':' + s.toString().padStart(2, '0');
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px monospace';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.fillText(str, tz.x + tz.w / 2, tz.y + tz.h / 2);
    ctx.textAlign = 'left';
  }

  // ── WAVEFORM MINI ──
  if (waveformPeaks) {
    const mz = z.miniwave;
    const playCol = Math.floor(playPct * mz.w);
    for (let x = 0; x < mz.w; x++) {
      const peak = waveformPeaks[Math.floor(x * waveformPeaks.length / mz.w)];
      const h = Math.max(1, peak * mz.h * 0.75);
      ctx.fillStyle = x < playCol ? '#44932f' : '#ffffff';
      ctx.fillRect(mz.x + x, mz.y + mz.h / 2 - h / 2, 1, h);
    }
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(mz.x + playCol, mz.y, 1, mz.h);
  }

  // ── ARTWORK ──
  {
    const az = z.artwork;
    if (artworkImage) {
      ctx.drawImage(artworkImage, az.x, az.y, az.w, az.h);
    } else {
      ctx.fillStyle = '#000000';
      ctx.fillRect(az.x, az.y, az.w, az.h);
      if (esrPlaceholder.complete && esrPlaceholder.naturalWidth > 0) {
        // Centre logo with padding — black bg already drawn, logo fits inside
        const pad = 8;
        const maxW = az.w - pad * 2;
        const maxH = az.h - pad * 2;
        const scale = Math.min(maxW / esrPlaceholder.naturalWidth, maxH / esrPlaceholder.naturalHeight) * 0.7;
        const lw = esrPlaceholder.naturalWidth * scale;
        const lh = esrPlaceholder.naturalHeight * scale;
        const lx = az.x + (az.w - lw) / 2;
        const ly = az.y + (az.h - lh) / 2;
        ctx.drawImage(esrPlaceholder, lx, ly, lw, lh);
      }
    }
    // white border always visible
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(az.x + 0.75, az.y + 0.75, az.w - 1.5, az.h - 1.5);
  }

  ctx.globalAlpha = 1; // always restore
  screenTexture.needsUpdate = true;
}

function onTrackReady(track) {
  waveformPeaks = null;
  artworkImage = null;
  trackFadeAlpha = 0;
  trackFadeStart = performance.now();
  if (track.buffer) computeWaveformPeaks(track.buffer);
  cacheArtwork(track);
  drawScreen();
}

// ── Model ──
let deckModel = null;
let modelBox = null;
let modelCenter = new THREE.Vector3();
let modelSize = new THREE.Vector3();
let modelScale = 1;
const hitboxes = {};
let jogWheel  = null;
let cueButton  = null;
let playButton = null;

const loader = new THREE.GLTFLoader();
loader.load('deck.glb', (gltf) => {
  deckModel = gltf.scene;
  deckModel.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true; child.receiveShadow = true;
      if (child.name.toLowerCase().includes('djm') || child.name.toLowerCase().includes('mixer')) {
        child.visible = false;
      }
    }
  });

  const box = new THREE.Box3().setFromObject(deckModel);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  modelScale = 3.2 / maxDim;
  deckModel.scale.setScalar(modelScale);
  deckModel.position.set((-center.x * modelScale) + 1.05, -box.min.y * modelScale, -center.z * modelScale);

  scene.add(deckModel);
  deckModel.updateMatrixWorld(true);

  // Deck position: computed from model bounding box — no localStorage override

  modelBox = new THREE.Box3().setFromObject(deckModel);
  modelBox.getCenter(modelCenter);
  modelBox.getSize(modelSize);

  // Find the CDJ mesh (not the DJM mixer)
  let cdj3000Mesh = null;
  deckModel.traverse(child => {
    if (child.isMesh && !child.name.toLowerCase().includes('djm')) cdj3000Mesh = child;
  });

  setupHitboxes();
  if (cdj3000Mesh) splitMeshParts(cdj3000Mesh);

  // Apply clip only to CDJ geometry — leaves underglow/sprites unclipped
  deckModel.traverse(c => { if (c.isMesh && c.material) [].concat(c.material).forEach(m => m.clippingPlanes = [clipX]); });
  [jogWheel, cueButton, playButton].forEach(obj => {
    if (!obj) return;
    obj.traverse(c => { if (c.isMesh && c.material) [].concat(c.material).forEach(m => m.clippingPlanes = [clipX]); });
  });

  buildScreenPlane();

  const ls = document.getElementById('loading-screen');
  ls.classList.add('hidden');
  setTimeout(() => ls.remove(), 600);
  window.deckReady = true;
  console.log('[CDJ] Ready');
}, undefined, (err) => {
  console.error('[CDJ] GLB load failed:', err);
  document.querySelector('#loading-screen p').textContent = 'LOAD FAILED';
});

// ── Hitboxes — exact positions from mesh mapper ──
function makeHitbox(name, w, h, d, color = 0x00ff41) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.0, depthWrite: false });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = name;
  mesh.userData.hitboxName = name;
  scene.add(mesh);
  hitboxes[name] = mesh;
  return mesh;
}

function setupHitboxes() {
  const jog = makeHitbox('jog', 0.68, 0.06, 0.68, 0x00ff41);
  jog.position.set(-0.027, 0.371, 0.334);

  const play = makeHitbox('play', 0.13, 0.04, 0.13, 0x0000ff);
  play.position.set(-0.464, 0.355, 0.701);

  const cue = makeHitbox('cue', 0.13, 0.04, 0.13, 0xff0000);
  cue.position.set(-0.464, 0.355, 0.555);

  const usb = makeHitbox('usb', 0.09, 0.15, 0.06, 0xffff00);
  usb.position.set(-0.494, 0.410, -0.511);

  const deck = makeHitbox('deck', 1.1, 0.08, 1.4, 0x0088ff);
  deck.position.set(-0.027, 0.310, 0.116);
}

// ── Geometry Split — extract jog wheel, cue & play buttons as independent meshes ──
function splitMeshParts(deckMesh) {
  deckMesh.updateMatrixWorld(true);
  const worldMat = deckMesh.matrixWorld;

  const geo      = deckMesh.geometry;
  const posAttr  = geo.attributes.position;
  const normAttr = geo.attributes.normal;
  const uvAttr   = geo.attributes.uv;
  const idx      = geo.index;
  const triCount = idx ? idx.count / 3 : posAttr.count / 3;

  // Classifier functions — derived from mesh mapper world-space data
  // Jog wheel: cylindrical filter (box fails — deck surface sits at same Y as wheel base)
  // Mapper: sides center (-0.0271, 0.3715, 0.3343) r=0.3296 h=0.0528 | top center y=0.3979 r=0.2674
  const JOG_CX = -0.0271, JOG_CZ = 0.3343, JOG_R = 0.335, JOG_YMIN = 0.348, JOG_YMAX = 0.408;

  // Cue / play / usb: tight boxes from mapper
  const cueBB  = new THREE.Box3(new THREE.Vector3(-0.525, 0.334, 0.492), new THREE.Vector3(-0.402, 0.362, 0.618));
  const playBB = new THREE.Box3(new THREE.Vector3(-0.525, 0.334, 0.638), new THREE.Vector3(-0.402, 0.362, 0.764));
  // USB housing: mapper center (-0.4937, 0.4103, -0.5112) size (0.0711, 0.1370, 0.0365)
  const usbBB  = new THREE.Box3(new THREE.Vector3(-0.536, 0.335, -0.532), new THREE.Vector3(-0.452, 0.485, -0.492));

  function classify(c) {
    // Jog wheel — cylindrical test
    const dx = c.x - JOG_CX, dz = c.z - JOG_CZ;
    if (dx*dx + dz*dz <= JOG_R*JOG_R && c.y >= JOG_YMIN && c.y <= JOG_YMAX) return 'jog';
    if (usbBB.containsPoint(c))  return 'usb';
    if (cueBB.containsPoint(c))  return 'cue';
    if (playBB.containsPoint(c)) return 'play';
    return 'rest';
  }

  const buckets = { jog: [], cue: [], play: [], usb: [], rest: [] };
  const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
  const centroid = new THREE.Vector3();

  for (let t = 0; t < triCount; t++) {
    const ia = idx ? idx.getX(t*3)   : t*3;
    const ib = idx ? idx.getX(t*3+1) : t*3+1;
    const ic = idx ? idx.getX(t*3+2) : t*3+2;

    vA.fromBufferAttribute(posAttr, ia).applyMatrix4(worldMat);
    vB.fromBufferAttribute(posAttr, ib).applyMatrix4(worldMat);
    vC.fromBufferAttribute(posAttr, ic).applyMatrix4(worldMat);
    centroid.copy(vA).add(vB).add(vC).divideScalar(3);

    buckets[classify(centroid)].push(ia, ib, ic);
  }

  // Build non-indexed BufferGeometry — local space (for deck remainder)
  function buildGeo(triIndices) {
    const n = triIndices.length;
    const positions = new Float32Array(n * 3);
    const normals   = normAttr ? new Float32Array(n * 3) : null;
    const uvs       = uvAttr   ? new Float32Array(n * 2) : null;
    for (let i = 0; i < n; i++) {
      const vi = triIndices[i];
      positions[i*3]   = posAttr.getX(vi);
      positions[i*3+1] = posAttr.getY(vi);
      positions[i*3+2] = posAttr.getZ(vi);
      if (normals) { normals[i*3] = normAttr.getX(vi); normals[i*3+1] = normAttr.getY(vi); normals[i*3+2] = normAttr.getZ(vi); }
      if (uvs)     { uvs[i*2]    = uvAttr.getX(vi);    uvs[i*2+1]    = uvAttr.getY(vi); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    if (normals) g.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    if (uvs)     g.setAttribute('uv',     new THREE.BufferAttribute(uvs, 2));
    return g;
  }

  // Build geometry in WORLD space — so independent meshes sit in scene with identity transform
  // and position.y changes map directly to world-space movement (depress works at real units)
  const normalMatrix = new THREE.Matrix3().getNormalMatrix(worldMat);
  const _v = new THREE.Vector3();
  function buildGeoWorld(triIndices) {
    const n = triIndices.length;
    const positions = new Float32Array(n * 3);
    const normals   = normAttr ? new Float32Array(n * 3) : null;
    const uvs       = uvAttr   ? new Float32Array(n * 2) : null;
    for (let i = 0; i < n; i++) {
      const vi = triIndices[i];
      _v.set(posAttr.getX(vi), posAttr.getY(vi), posAttr.getZ(vi)).applyMatrix4(worldMat);
      positions[i*3] = _v.x; positions[i*3+1] = _v.y; positions[i*3+2] = _v.z;
      if (normals) {
        _v.set(normAttr.getX(vi), normAttr.getY(vi), normAttr.getZ(vi)).applyMatrix3(normalMatrix).normalize();
        normals[i*3] = _v.x; normals[i*3+1] = _v.y; normals[i*3+2] = _v.z;
      }
      if (uvs) { uvs[i*2] = uvAttr.getX(vi); uvs[i*2+1] = uvAttr.getY(vi); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    if (normals) g.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    if (uvs)     g.setAttribute('uv',     new THREE.BufferAttribute(uvs, 2));
    return g;
  }

  // Like buildGeoWorld but splits each triangle at splitY — triangles crossing the boundary
  // are subdivided so colour changes exactly at the cut plane, not at triangle granularity.
  function buildGeoWorldSplit(triIndices, splitY) {
    const hasNorm = !!normAttr, hasUV = !!uvAttr;
    const topPos = [], topNrm = [], topUV = [];
    const botPos = [], botNrm = [], botUV = [];

    function lerp(a, b, t) { return a + t * (b - a); }

    // Get world-space vert struct for a buffer index
    function getV(vi) {
      const p = new THREE.Vector3(posAttr.getX(vi), posAttr.getY(vi), posAttr.getZ(vi)).applyMatrix4(worldMat);
      let nx = 0, ny = 0, nz = 0;
      if (hasNorm) {
        const n = new THREE.Vector3(normAttr.getX(vi), normAttr.getY(vi), normAttr.getZ(vi)).applyMatrix3(normalMatrix).normalize();
        nx = n.x; ny = n.y; nz = n.z;
      }
      return { x: p.x, y: p.y, z: p.z, nx, ny, nz,
               u: hasUV ? uvAttr.getX(vi) : 0, v: hasUV ? uvAttr.getY(vi) : 0 };
    }

    // Linear-interpolate two verts to Y = splitY
    function split(va, vb) {
      const t = (splitY - va.y) / (vb.y - va.y);
      return { x: lerp(va.x,vb.x,t), y: splitY, z: lerp(va.z,vb.z,t),
               nx: lerp(va.nx,vb.nx,t), ny: lerp(va.ny,vb.ny,t), nz: lerp(va.nz,vb.nz,t),
               u: lerp(va.u,vb.u,t), v: lerp(va.v,vb.v,t) };
    }

    function push(isTop, v) {
      const pos = isTop ? topPos : botPos;
      const nrm = isTop ? topNrm : botNrm;
      const uv  = isTop ? topUV  : botUV;
      pos.push(v.x, v.y, v.z);
      if (hasNorm) nrm.push(v.nx, v.ny, v.nz);
      if (hasUV)   uv.push(v.u, v.v);
    }

    function tri(isTop, a, b, c) { push(isTop,a); push(isTop,b); push(isTop,c); }

    for (let i = 0; i < triIndices.length; i += 3) {
      const va = getV(triIndices[i]), vb = getV(triIndices[i+1]), vc = getV(triIndices[i+2]);
      const at = va.y > splitY, bt = vb.y > splitY, ct = vc.y > splitY;
      const n = (at?1:0) + (bt?1:0) + (ct?1:0);

      if (n === 3) { tri(true,  va, vb, vc); }
      else if (n === 0) { tri(false, va, vb, vc); }
      else if (n === 1) {
        // one vertex above: find it, label remaining as bot1/bot2 preserving winding
        let top, b1, b2;
        if (at) { top=va; b1=vb; b2=vc; }
        else if (bt) { top=vb; b1=vc; b2=va; }
        else          { top=vc; b1=va; b2=vb; }
        const p1 = split(top, b1), p2 = split(top, b2);
        tri(true,  top, p1,  p2);   // 1 top tri
        tri(false, p1,  b1,  b2);   // 2 bottom tris (quad)
        tri(false, p1,  b2,  p2);
      } else { // n === 2
        // one vertex below
        let bot, t1, t2;
        if (!at) { bot=va; t1=vb; t2=vc; }
        else if (!bt) { bot=vb; t1=vc; t2=va; }
        else           { bot=vc; t1=va; t2=vb; }
        const p1 = split(bot, t1), p2 = split(bot, t2);
        tri(false, bot, p1,  p2);   // 1 bottom tri
        tri(true,  p1,  t1,  t2);   // 2 top tris (quad)
        tri(true,  p1,  t2,  p2);
      }
    }

    function makeGeo(pos, nrm, uv) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
      if (hasNorm && nrm.length) g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(nrm), 3));
      if (hasUV   && uv.length)  g.setAttribute('uv',     new THREE.BufferAttribute(new Float32Array(uv),  2));
      return g;
    }

    const topGeo = makeGeo(topPos, topNrm, topUV);
    const botGeo = makeGeo(botPos, botNrm, botUV);
    const allPos = new Float32Array(topPos.length + botPos.length);
    allPos.set(topPos); allPos.set(botPos, topPos.length);
    const fullBB = new THREE.Box3().setFromBufferAttribute(new THREE.BufferAttribute(allPos, 3));
    return { topGeo, botGeo, fullBB };
  }

  // Spawn world-space mesh added directly to scene (identity transform)
  const origMat = Array.isArray(deckMesh.material) ? deckMesh.material[0] : deckMesh.material;
  function makeWorldMesh(geo, name) {
    const m = new THREE.Mesh(geo, origMat.clone());
    m.name = name;
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    return m;
  }

  // Swap deck geometry for the remainder (leaves real holes)
  const restGeo = buildGeo(buckets.rest);
  deckMesh.geometry.dispose();
  deckMesh.geometry = restGeo;

  // Jog wheel — world-space geometry, pivot at exact mapped centre so rotation.y spins in place
  // Pivot axis: x=-0.0271, z=0.3343 (from mapper — jog wheel sides centre)
  const jogGeoWorld = buildGeoWorld(buckets.jog);
  const JOG_PIVOT = new THREE.Vector3(JOG_CX, 0, JOG_CZ); // Y doesn't matter for spin axis
  const jogPos = jogGeoWorld.attributes.position;
  for (let i = 0; i < jogPos.count; i++) {
    jogPos.setXYZ(i, jogPos.getX(i) - JOG_PIVOT.x, jogPos.getY(i), jogPos.getZ(i) - JOG_PIVOT.z);
  }
  jogPos.needsUpdate = true;
  const jogMesh = new THREE.Mesh(jogGeoWorld, origMat.clone());
  jogMesh.castShadow = true; jogMesh.receiveShadow = true;
  const jogPivot = new THREE.Group();
  jogPivot.name = 'jog_wheel';
  jogPivot.position.set(JOG_CX, 0, JOG_CZ);
  jogPivot.add(jogMesh);
  scene.add(jogPivot);
  jogWheel = jogPivot;

  cueButton  = makeWorldMesh(buildGeoWorld(buckets.cue),  'cue_button');
  playButton = makeWorldMesh(buildGeoWorld(buckets.play), 'play_button');

  // Split USB at Y midpoint: top half dark green body, bottom half silver plug
  const USB_SPLIT_Y = 0.362;
  const { topGeo: usbTopGeo, botGeo: usbBotGeo, fullBB: usbFullBB } = buildGeoWorldSplit(buckets.usb, USB_SPLIT_Y);

  usbMesh = new THREE.Mesh(usbTopGeo, new THREE.MeshBasicMaterial({ color: 0x000000 }));
  usbMesh.name = 'usb_stick'; usbMesh.castShadow = false; usbMesh.receiveShadow = false;
  scene.add(usbMesh);

  usbStemMesh = new THREE.Mesh(usbBotGeo, new THREE.MeshBasicMaterial({ color: 0xb0b8c0 }));
  usbStemMesh.name = 'usb_plug'; usbStemMesh.castShadow = false; usbStemMesh.receiveShadow = false;
  scene.add(usbStemMesh);

  usbFullBB.getCenter(USB_BAKED_CENTER); USB_BAKED_Z_FRONT = usbFullBB.max.z;

  // ii logo plane on front face of USB (top/green half)
  { const _img = new Image();
    _img.onload = () => {
      const _c = document.createElement('canvas');
      _c.width = _img.width; _c.height = _img.height;
      const _x = _c.getContext('2d');
      _c.height = _img.height;
      _x.drawImage(_img, 0, 0);
      _x.globalCompositeOperation = 'source-atop';
      _x.fillStyle = '#ffffff';
      _x.fillRect(0, 0, _c.width, _img.height);
      _x.globalCompositeOperation = 'source-over';

      logoPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(0.0408, 0.0391),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(_c), transparent: true, depthWrite: false, alphaTest: 0.05 })
      );
      logoPlane.renderOrder = 1;
      scene.add(logoPlane);
    };
    _img.src = 'assets/asset-c379a222.png';
  }

  // Halo sprite — white radial glow surrounding the USB
  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = 128; glowCanvas.height = 128;
  const gctx = glowCanvas.getContext('2d');
  const grad = gctx.createRadialGradient(64,64,4,64,64,64);
  grad.addColorStop(0,    'rgba(255,255,255,0.9)');
  grad.addColorStop(0.25, 'rgba(255,255,255,0.5)');
  grad.addColorStop(0.6,  'rgba(255,255,255,0.15)');
  grad.addColorStop(1,    'rgba(255,255,255,0)');
  gctx.fillStyle = grad; gctx.fillRect(0,0,128,128);
  glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(glowCanvas),
    transparent: true, depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending
  }));
  glowSprite.scale.set(0.18, 0.26, 1);
  scene.add(glowSprite);

  // Subtle top-right → bottom-left sheen on USB face
  { const _gc = document.createElement('canvas'); _gc.width = 64; _gc.height = 128;
    const _gx = _gc.getContext('2d');
    const _gr = _gx.createLinearGradient(64, 0, 0, 128); // top-right to bottom-left
    _gr.addColorStop(0,   'rgba(255,255,255,0.18)');
    _gr.addColorStop(0.5, 'rgba(255,255,255,0.05)');
    _gr.addColorStop(1,   'rgba(255,255,255,0)');
    _gx.fillStyle = _gr; _gx.fillRect(0, 0, 64, 128);
    usbFaceGlow = new THREE.Mesh(
      new THREE.PlaneGeometry(0.058, 0.11),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(_gc), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })
    );
    usbFaceGlow.renderOrder = 2;
    scene.add(usbFaceGlow);
  }
  // Restore position
  usbMesh.position.set(0.467, 0.75, 0.90);
  if (usbStemMesh) usbStemMesh.position.copy(usbMesh.position);
  updateDebug(`USB tris: ${buckets.usb.length/3}`);

  // Emissive LED materials — play green, cue amber
  playButton.material.emissive = new THREE.Color(0x00ff41);
  playButton.material.emissiveIntensity = 0;
  cueButton.material.emissive  = new THREE.Color(0xff8800);
  cueButton.material.emissiveIntensity = 0;

  // Record base Y so depress/release can offset from it
  btnState.play.yBase = playButton.position.y;
  btnState.cue.yBase  = cueButton.position.y;

} // end splitMeshParts

function endJogDrag() {
  if (!state.jogDragging) return;
  state.jogDragging = false;
  // jogEngaged stays true — inertia continues in animate loop until velocity → 0
}

function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60), ms = Math.floor((sec % 1) * 10);
  return ms ? `${m}:${String(s).padStart(2,'0')}.${ms}` : `${m}:${String(s).padStart(2,'0')}`;
}

let hoveredTarget = null;

let deckDragging = false;
let usbDragging  = false;
let usbDragMoved = false;

let usbDragStartY = 0;

const usbDragOffset  = new THREE.Vector3();
const usbDragPlane   = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

function moveDeckBy(delta) {
  if (!deckModel) return;
  deckModel.position.add(delta);
  // Keep hitboxes in sync
  Object.values(hitboxes).forEach(h => h.position.add(delta));
  if (playButton)   playButton.position.add(delta);
  if (cueButton)    cueButton.position.add(delta);
  if (jogWheel)     jogWheel.position.add(delta);
}

// How many cycles per pixel of drag — tune this to feel right on screen
const JOG_PX_PER_CYCLE = 80; // ~80px drag = 1 full rotation

const SECS_PER_CYCLE = 2.0; // seconds of audio per full wheel rotation

function startJogDrag(clientX) {
  if (!state.trackLoaded) return;
  ensureAudioCtx();

  // Compute true current position:
  // - If wheel is already spinning (jogEngaged), jogAudioPos is the accurate position
  //   because playback rate has been varying — keep it.
  // - If wheel is idle (jogEngaged false), compute directly from source timing so
  //   stale jogAudioPos from a previous jog (e.g. before CUE) never bleeds through.
  let truePos;
  if (state.jogEngaged) {
    truePos = state.jogAudioPos; // mid-spin — this is the accurate position
  } else if (state.playing && state.audioCtx) {
    truePos = state.pauseOffset + (state.audioCtx.currentTime - state.startTime) * state.playbackRate;
  } else {
    truePos = state.pauseOffset;
  }
  truePos = Math.max(0, Math.min(state.duration, truePos));

  // Clear stale jog state before starting fresh
  state.jogEngaged  = false;
  state.jogVelocity = 0;
  state.jogAudioPos = 0;

  state.jogDragging    = true;
  state.jogEngaged     = true;
  state.jogStartX      = clientX;
  state.jogStartOffset = state.jogRotation;
  state.jogPrevX       = clientX;
  state.jogPrevTime    = performance.now();
  state.jogVelocity    = 0;
  state.jogWasPlaying  = state.playing;
  state.jogAudioPos    = truePos;

  console.log('[JOG START] truePos:', truePos.toFixed(3), 'pauseOffset:', state.pauseOffset.toFixed(3));

  // Sync source to exact current position and freeze
  startSource(truePos);
  state.sourceNode.playbackRate.value = 0;
}

function moveJogDrag(clientX) {
  state.jogRotation = state.jogStartOffset + (clientX - state.jogStartX) / JOG_PX_PER_CYCLE;

  const now = performance.now();
  const dt  = (now - state.jogPrevTime) / 1000;
  if (dt > 0.005) {
    state.jogVelocity = (clientX - state.jogPrevX) / JOG_PX_PER_CYCLE / dt;
    state.jogPrevX    = clientX;
    state.jogPrevTime = now;
  }
}

function getMouseNDC(e) {
  return new THREE.Vector2(
    (e.clientX / window.innerWidth) * 2 - 1,
    -(e.clientY / window.innerHeight) * 2 + 1
  );
}

function raycastScene(ndc) {
  raycaster.setFromCamera(ndc, camera);

  // Single raycast against all interactive objects — closest hit wins (correct depth order)
  const targets = [
    hitboxes['play'], hitboxes['cue'],   // large invisible boxes — easy to hit
    playButton, cueButton,               // actual geometry fallback
    jogWheel ? hitboxes['jog'] : null,
    hitboxes['usb'],
    usbMesh, usbStemMesh,
    hitboxes['deck'],
  ].filter(Boolean);

  const hits = raycaster.intersectObjects(targets, false);
  if (!hits.length) return null;

  const obj = hits[0].object;
  if (obj === hitboxes['play'] || obj === playButton) return { type: 'hitbox', name: 'play' };
  if (obj === hitboxes['cue']  || obj === cueButton)  return { type: 'hitbox', name: 'cue' };
  if (obj === hitboxes['jog'])  return { type: 'hitbox', name: 'jog' };
  if (obj === hitboxes['usb'] || obj === usbMesh || obj === usbStemMesh) return { type: 'hitbox', name: 'usb' };
  if (obj === hitboxes['deck']) return { type: 'hitbox', name: 'deck' };

  return null;
}

canvas3d.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  const result = raycastScene(getMouseNDC(e));
  if (!result) return;

  if (result.type === 'usb') {
    if (state.usbInserted) openTrackPanel(); else triggerUSBInsert();
    return;
  }

  if (result.type === 'hitbox') {
    if (result.name === 'jog') { isDraggingJog = true; startJogDrag(e.clientX); return; }
    if (result.name === 'play') { heldButton = 'play'; pressButton('play'); return; }
    if (result.name === 'cue')  { heldButton = 'cue';  pressButton('cue');  return; }
    if (result.name === 'deck') { return; } // deck drag disabled
    if (result.name === 'usb') {
      // drag disabled — treat as click only
      if (state.usbInserted) openTrackPanel(); else triggerUSBInsert();
      return;
    }
  }
});

canvas3d.addEventListener('mousemove', (e) => {
  if (isDraggingJog) { moveJogDrag(e.clientX); return; }

  if (deckDragging && deckModel) {
    if (zKeyHeld) {
      const dy = (deckDragStartMouseY - e.clientY) / window.innerHeight;
      const targetY = deckDragStartY + dy * 2.0;
      moveDeckBy(new THREE.Vector3(0, targetY - deckModel.position.y, 0));
    } else {
      raycaster.setFromCamera(getMouseNDC(e), camera);
      const hit = new THREE.Vector3();
      raycaster.ray.intersectPlane(deckDragPlane, hit);
      if (hit) {
        const dx = hit.x + deckDragOffset.x - deckModel.position.x;
        const dz = hit.z + deckDragOffset.z - deckModel.position.z;
        moveDeckBy(new THREE.Vector3(dx, 0, dz));
      }
    }
    return;
  }

  if (usbDragging && usbMesh) {
    if (zKeyHeld) {
      // Z held: mouse Y controls height
      const dy = (usbDragStartMouseY - e.clientY) / window.innerHeight;
      usbMesh.position.y = usbDragStartY + dy * 2.0;
    } else {
      // Normal drag: XZ plane
      raycaster.setFromCamera(getMouseNDC(e), camera);
      const hit = new THREE.Vector3();
      raycaster.ray.intersectPlane(usbDragPlane, hit);
      if (hit) {
        usbMesh.position.x = hit.x + usbDragOffset.x;
        usbMesh.position.z = hit.z + usbDragOffset.z;
      }
    }
    if (usbDragStartPos && usbMesh.position.distanceTo(usbDragStartPos) > 0.04) usbDragMoved = true;
    return;
  }

  const result = raycastScene(getMouseNDC(e));

  const newHover = result ? result.name : null;
  if (newHover !== hoveredTarget) {
    applyHoverEffect(hoveredTarget, false);
    applyHoverEffect(newHover, true);
    hoveredTarget = newHover;
  }
});

canvas3d.addEventListener('mouseup', () => {
  if (isDraggingJog) { isDraggingJog = false; endJogDrag(); }
  if (heldButton) { releaseButton(heldButton); heldButton = null; }
  if (deckDragging) { deckDragging = false; }
  if (usbDragging) {
    usbDragging = false;
    if (!usbDragMoved) {
      if (state.usbInserted) openTrackPanel(); else triggerUSBInsert();
    }
  }
});

canvas3d.addEventListener('mouseleave', () => {
  if (isDraggingJog) { isDraggingJog = false; endJogDrag(); }
  if (heldButton) { releaseButton(heldButton); heldButton = null; }
  if (deckDragging) { deckDragging = false; }

function selectTrack(idx) {

  if (t.buffer) {

  } else if (t.arrayBuf) {
    // ArrayBuffer in memory — decode now
    setTrackStatus('DECODING...');
    state.audioCtx.decodeAudioData(t.arrayBuf.slice(0), (buffer) => {
      t.buffer = buffer; t.duration = buffer.duration; t.arrayBuf = null;
      state.audioBuffer = buffer; state.duration = buffer.duration;
      state.trackLoaded = true; state.pauseOffset = 0; state.cuePoint = 0;

    }, err => { console.error('[CDJ] decode failed', t.djName, err); setTrackStatus('DECODE ERROR'); });
  } else if (t.path || t.file) {

    setTrackStatus('LOADING...');
    const bufPromise = t.file
      ? new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsArrayBuffer(t.file); })
      : fetch(t.path).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
    bufPromise
      .then(arrayBuf => {
        setTrackStatus('DECODING...');
        // Safari decodeAudioData is callback-only — wrap for cross-browser compat
        return new Promise((res, rej) => state.audioCtx.decodeAudioData(arrayBuf, res, rej));
      })
      .then(buffer => {
        t.buffer = buffer; t.duration = buffer.duration; t.file = null;
        state.audioBuffer = buffer; state.duration = buffer.duration;
        state.trackLoaded = true; state.pauseOffset = 0; state.cuePoint = 0;
        updatePills(); setTrackStatus(''); onTrackReady(t);
        // Auto-play if user already pressed play while track was loading
        if (state._pendingPlay) { state._pendingPlay = false; startSource(0); }
      })
      .catch(err => { console.error('[CDJ] load failed', t.path || (t.file && t.file.name), err); setTrackStatus('LOAD ERROR'); });
  }
}

// ── Audio Engine ──
// Pre-fetched ArrayBuffers waiting for AudioContext to exist before decoding
const _pendingDecode = [];

function ensureAudioCtx() {
  if (!state.audioCtx) {
    state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    state.gainNode = state.audioCtx.createGain();
    state.gainNode.connect(state.audioCtx.destination);
    // Drain any tracks fetched before this moment
    _pendingDecode.splice(0).forEach(({ arrayBuf, djName, trackTitle }) =>
      _decodeAndStore(arrayBuf, djName, trackTitle)
    );
  }
  if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
}

function _decodeAndStore(arrayBuf, djName, trackTitle) {
  // Store immediately for display — decode lazily when track is selected
  const artwork = trackTitle === 'WiiTH EVERY HEARTBEAT' ? DEFAULT_ART : djName === 'RISTO' ? RISTO_ART : djName === 'DARRAGH_ii' ? DARRAGH_ART : djName === 'ANDREW MCCARTHY' ? ANDREW_ART : DEFAULT_ART;
  trackLibrary.push({ djName, trackTitle, artwork, buffer: null, duration: null, arrayBuf });
  setTrackStatus(trackLibrary.length + ' TRACK' + (trackLibrary.length > 1 ? 'S' : '') + ' LOADED');
  renderTrackList(document.getElementById('track-search').value);
}

function setTrackStatus(msg) { /* suppressed */ }

function loadAudioFile(file) {
  const raw = file.name.replace(/\.[^.]+$/, '');
  const sep = raw.indexOf(' - ');
  const djName     = (sep > -1 ? raw.slice(0, sep) : raw).toUpperCase().replace(/II/g, 'ii');
  const trackTitle = sep > -1 ? raw.slice(sep + 3).toUpperCase().replace(/II/g, 'ii') : '';
  const artwork = djName === 'RISTO' ? RISTO_ART : djName === 'DARRAGH_ii' ? DARRAGH_ART : djName === 'ANDREW MCCARTHY' ? ANDREW_ART : DEFAULT_ART;
  // Register immediately — store the File object for lazy read on select
  trackLibrary.push({ djName, trackTitle, artwork, buffer: null, duration: null, arrayBuf: null, path: null, file });
  renderTrackList(document.getElementById('track-search').value);
}

// ── Audio position foundation ─────────────────────────────────────────────────

// Returns current playhead position in seconds (accurate during play or pause)
function getPos() {
  if (state.jogEngaged) return state.jogAudioPos;
  if (!state.playing || !state.audioCtx) return state.pauseOffset;
  return state.pauseOffset + (state.audioCtx.currentTime - state.startTime) * state.playbackRate;
}
// keep old name working
function getCurrentTime() { return getPos(); }

// Seek to any position in seconds — zero-click, safe to call anytime
function smoothSeek(seconds) {
  if (!state.trackLoaded) return;
  const pos = Math.max(0, Math.min(seconds, state.duration - 0.01));
  if (state.playing) {
    // 5ms gain fade-out → restart at new position → 5ms fade-in
    const ctx = state.audioCtx;
    const now = ctx.currentTime;
    state.gainNode.gain.cancelScheduledValues(now);
    state.gainNode.gain.setValueAtTime(1, now);
    state.gainNode.gain.linearRampToValueAtTime(0, now + 0.005);
    setTimeout(() => {
      startSource(pos);
      const t = state.audioCtx.currentTime;
      state.gainNode.gain.cancelScheduledValues(t);
      state.gainNode.gain.setValueAtTime(0, t);
      state.gainNode.gain.linearRampToValueAtTime(1, t + 0.005);
    }, 6);
  } else {
    state.pauseOffset = pos;
  }
}

// Legacy pct-based seek (keyboard arrows etc.) — maps onto smoothSeek
function seekTo(pct) {
  smoothSeek(pct * state.duration);
}


function tapeStop() {
  // Wind down the actual playing audio — ramp rate and gain to zero then stop
  if (!state.sourceNode || !state.audioCtx) return;
  const ctx = state.audioCtx;
  const dur = 0.35;
  state.sourceNode.playbackRate.cancelScheduledValues(ctx.currentTime);
  state.sourceNode.playbackRate.setValueAtTime(state.playbackRate, ctx.currentTime);
  state.sourceNode.playbackRate.linearRampToValueAtTime(0.0001, ctx.currentTime + dur);
  state.gainNode.gain.cancelScheduledValues(ctx.currentTime);
  state.gainNode.gain.setValueAtTime(1, ctx.currentTime);
  state.gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + dur);
  const stopAt = ctx.currentTime + dur + 0.05;
  sourceGen++;
  const frozenGen = sourceGen;
  state.sourceNode.stop(stopAt);
  setTimeout(() => {
    // Restore gain and mark as paused
    state.gainNode.gain.cancelScheduledValues(ctx.currentTime);
    state.gainNode.gain.setValueAtTime(1, ctx.currentTime);
    if (frozenGen === sourceGen) {
      state.playing = false;
      updatePills();
    }
  }, (dur + 0.1) * 1000);
}

function togglePlay() {
  if (!state.trackLoaded) { state._pendingPlay = true; return; }
  ensureAudioCtx();
  // await resume on iOS where AudioContext starts suspended
  const resumePromise = state.audioCtx.state === 'suspended' ? state.audioCtx.resume() : Promise.resolve();
  resumePromise.then(() => _doTogglePlay());
}
function _doTogglePlay() {

  if (state.jogEngaged) {
    // Wheel is spinning — freeze audio at current jog position but let
    // the physical wheel visual continue its inertia uninterrupted.
    const snapPos = Math.max(0, Math.min(state.duration, state.jogAudioPos));
    if (state.playing) {
      state.pauseOffset = snapPos;
      state.jogWasPlaying = false; // wheel release won't auto-resume
      tapeStop();
    } else {
      state.jogWasPlaying = true;
      startSource(snapPos);
    }
    return;
  }

  // Normal play/pause (no spin in progress)
  state.jogEngaged  = false;
  state.jogVelocity = 0;
  if (state.playing) {
    state.pauseOffset = getPos();
    state.playing = false; // freeze waveform immediately — tape stop winds down audio in background
    updatePills();
    tapeStop();
  } else {
    startSource(state.pauseOffset);
  }
}

function startSource(offset) {
  if (state.sourceNode) { try { state.sourceNode.stop(); } catch(e){} }
  sourceGen++;
  const gen = sourceGen;
  state.sourceNode = state.audioCtx.createBufferSource();
  state.sourceNode.buffer = state.audioBuffer;
  state.sourceNode.playbackRate.value = state.playbackRate;
  state.sourceNode.connect(state.gainNode);
  state.sourceNode.start(0, Math.max(0, Math.min(offset, state.duration - 0.01)));
  state.startTime = state.audioCtx.currentTime;
  state.pauseOffset = offset;
  state.playing = true;
  state.sourceNode.onended = () => {
    if (gen === sourceGen && state.playing) {
      state.playing = false;
      state.pauseOffset = 0;
      updatePills();
    }
  };
  
  
  updatePills();
}

function pressCue() {
  if (!state.trackLoaded) return;
  // Kill any jog inertia so getPos() doesn't return the stale jogAudioPos
  state.jogEngaged  = false;
  state.jogVelocity = 0;
  console.log('[CUE] pressed — pos before:', getPos().toFixed(3), 'jogEngaged:', state.jogEngaged, 'jogAudioPos:', state.jogAudioPos.toFixed(3));
  startSource(0);
  console.log('[CUE] after startSource(0) — pauseOffset:', state.pauseOffset);
}

const scrollTrack = document.getElementById('deck-scroll');
const scrollThumb = document.getElementById('deck-scroll-thumb');
const SCROLL_Y_MIN = -0.6;  // deck Y range min
const SCROLL_Y_MAX =  0.6;  // deck Y range max
let scrollDragging = false;
let scrollDragStartY = 0;
let scrollDragStartThumbPct = 0.5;
let scrollThumbPct = 0.5; // 0 = top, 1 = bottom

function setScrollThumb(pct) {
  scrollThumbPct = Math.max(0, Math.min(1, pct));
  scrollThumb.style.top = `${scrollThumbPct * 100}%`;
}

function applyScrollToDeck(pct) {
  if (!deckModel) return;
  const targetY = SCROLL_Y_MAX - pct * (SCROLL_Y_MAX - SCROLL_Y_MIN);
  const delta = new THREE.Vector3(0, targetY - deckModel.position.y, 0);
  moveDeckBy(delta);
}

scrollThumb.addEventListener('mousedown', (e) => {
  e.stopPropagation();
  // scroll drag paused
});

document.addEventListener('mousemove', (e) => {
  if (!scrollDragging) return;
  const trackH = scrollTrack.getBoundingClientRect().height;
  const dy = (e.clientY - scrollDragStartY) / trackH;
  const newPct = Math.max(0, Math.min(1, scrollDragStartThumbPct + dy));
  setScrollThumb(newPct);
  applyScrollToDeck(newPct);
});

document.addEventListener('mouseup', () => {
  if (!scrollDragging) return;
  scrollDragging = false;
  scrollThumb.classList.remove('dragging');
  orbit.enabled = true;
});

scrollTrack.addEventListener('click', (e) => {
  if (e.target === scrollThumb) return;
  const rect = scrollTrack.getBoundingClientRect();
  const pct = (e.clientY - rect.top) / rect.height;
  setScrollThumb(pct);
  applyScrollToDeck(pct);
});

// ── Hover visual feedback ──
function applyHoverEffect(name, on) {
  if (!name) return;
  if (name === 'usb') {
    if (usbMesh)     usbMesh.material.color.setHex(on ? 0x1a1a1a : 0x000000);
    if (usbStemMesh) usbStemMesh.material.color.setHex(on ? 0xcdd4db : 0xb0b8c0);
  }
  if (name === 'jog' && jogWheel) {
    const m = jogWheel.children[0];
    if (m && m.material) {
      m.material.emissive = new THREE.Color(0xffffff);
      m.material.emissiveIntensity = on ? 0.08 : 0;
    }
  }
}

// ── Animate ──
let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  orbit.update();


  // USB animation — smooth path from wherever it is to target (insert or home)
  if (usbMesh && usbAnimating) {
    usbMesh.position.lerp(usbAnimTarget, Math.min(dt * 5, 1));
    if (usbStemMesh) usbStemMesh.position.copy(usbMesh.position);
    if (usbMesh.position.distanceTo(usbAnimTarget) < 0.002) {
      usbMesh.position.copy(usbAnimTarget);
      usbAnimating = false;
      if (usbInsertPanelPending) { usbInsertPanelPending = false; openTrackPanel(); }
    }
  }
  // USB idle bob + halo glow (only when not inserted)
  if (usbMesh && !state.usbInserted && !usbAnimating) {
    const t = now / 1000;
    const bob = 0.004 * Math.sin(t * 1.8);
    usbMesh.position.y = 0.75 + bob;
    const pulse = 0.7 + 0.3 * Math.sin(t * 2.2);
    glowSprite.position.set(
      usbMesh.position.x + USB_BAKED_CENTER.x,
      usbMesh.position.y + USB_BAKED_CENTER.y,
      usbMesh.position.z + USB_BAKED_CENTER.z - 0.04
    );
    glowSprite.material.opacity = pulse;
    glowSprite.visible = true;
    if (usbStemMesh) usbStemMesh.position.copy(usbMesh.position);
    if (logoPlane) {
      logoPlane.position.set(
        usbMesh.position.x + USB_BAKED_CENTER.x,
        usbMesh.position.y + USB_BAKED_CENTER.y + 0.025,
        usbMesh.position.z + USB_BAKED_Z_FRONT + 0.002
      );
    }
    if (usbFaceGlow) {
      usbFaceGlow.position.set(
        usbMesh.position.x + USB_BAKED_CENTER.x,
        usbMesh.position.y + USB_BAKED_CENTER.y + 0.010,
        usbMesh.position.z + USB_BAKED_Z_FRONT + 0.001
      );
      usbFaceGlow.visible = true;
    }
  } else if (usbMesh) {
    glowSprite.visible = false;
    if (usbStemMesh) usbStemMesh.position.copy(usbMesh.position);
    if (logoPlane) {
      logoPlane.position.set(
        usbMesh.position.x + USB_BAKED_CENTER.x,
        usbMesh.position.y + USB_BAKED_CENTER.y + 0.025,
        usbMesh.position.z + USB_BAKED_Z_FRONT + 0.002
      );
    }
    if (usbFaceGlow) {
      usbFaceGlow.position.set(
        usbMesh.position.x + USB_BAKED_CENTER.x,
        usbMesh.position.y + USB_BAKED_CENTER.y + 0.010,
        usbMesh.position.z + USB_BAKED_Z_FRONT + 0.001
      );
      usbFaceGlow.visible = true;
    }
  }

  if (jogWheel) {
    // ── Inertia: after mouse release, non-linear damping ─────────────────────
    // k is small at high speed (free coast) and large at low speed (heavy resist).
    // k = K_FREE + (K_RESIST - K_FREE) * 1/(1 + |v|/V_PIVOT)
    // This is purely multiplicative (v *= 1 - k*dt) so it always decays toward 0.
    const JOG_K_FREE   = 0.6;  // damping when spinning fast — nearly free
    const JOG_K_RESIST = 8.0;  // damping when nearly stopped — heavy drag
    const JOG_V_PIVOT  = 0.35; // velocity at which damping is at midpoint

    if (!state.jogDragging && state.jogEngaged) {
      const absV = Math.abs(state.jogVelocity);
      const t = 1 / (1 + absV / JOG_V_PIVOT); // 0 at high speed → 1 at rest
      const k = JOG_K_FREE + (JOG_K_RESIST - JOG_K_FREE) * t;
      state.jogVelocity *= Math.max(0, 1 - k * dt);
      state.jogRotation += state.jogVelocity * dt;

      if (Math.abs(state.jogVelocity) < 0.002) {
        // Wheel fully stopped — release audio
        state.jogVelocity = 0;
        state.jogEngaged  = false;
        const landPos = Math.max(0, Math.min(state.duration - 0.01, state.jogAudioPos));
        console.log('[JOG END] landPos:', landPos.toFixed(3), 'jogWasPlaying:', state.jogWasPlaying);
        if (state.jogWasPlaying) {
          startSource(landPos); // resume normal playback from where wheel stopped
        } else {
          sourceGen++;
          try { state.sourceNode.stop(); } catch(e) {}
          state.playing     = false;
          state.pauseOffset = landPos;
          updatePills();
        }
      }
    }

    // ── Visual ───────────────────────────────────────────────────────────────
    jogWheel.rotation.y = state.jogRotation * (Math.PI * 2);

    // ── Audio: every frame while engaged, map velocity → playback rate ────────
    if (state.jogEngaged && state.sourceNode) {
      // Position always tracks real direction (forward or backward)
      const posDelta = -state.jogVelocity * SECS_PER_CYCLE * dt;
      state.jogAudioPos = Math.max(0, Math.min(state.duration, state.jogAudioPos + posDelta));

      const isBackward = state.jogVelocity > 0.04;
      const isForward  = state.jogVelocity < -0.04;

      if (isForward) {
        // Forward: drive playback rate directly
        state.sourceNode.playbackRate.value = -state.jogVelocity * SECS_PER_CYCLE;
      } else if (isBackward) {
        // Backward: Web Audio can't reverse, so rapid-seek to shrinking positions
        // gives brief forward snippets from ever-receding points — scratch texture
        const now = performance.now();
        const seekEvery = Math.max(40, 120 - state.jogVelocity * 60); // faster spin = faster seeks
        if (now - state.jogLastBackSeek > seekEvery) {
          state.jogLastBackSeek = now;
          startSource(state.jogAudioPos);
          state.sourceNode.playbackRate.value = state.jogVelocity * SECS_PER_CYCLE * 0.7;
        }
      } else {
        // Nearly stopped
        state.sourceNode.playbackRate.value = 0;
      }
    }
  }

  // Button depress + LED glow animation (includes hover + play-hint pulse)
  for (const [name, st] of Object.entries(btnState)) {
    const btn = name === 'play' ? playButton : cueButton;
    if (!btn) continue;
    const speed = Math.min(dt * 28, 1);
    const targetY = st.yBase + (st.pressed ? -DEPRESS_Y : 0);
    let targetGlow = st.pressed ? BTN_GLOW : (hoveredTarget === name ? BTN_GLOW * 0.18 : 0);
    btn.position.y += (targetY - btn.position.y) * speed;
    btn.material.emissiveIntensity += (targetGlow - btn.material.emissiveIntensity) * speed;
    if (btn.userData.light) btn.userData.light.intensity += (targetGlow * 0.4 - btn.userData.light.intensity) * speed;
  }

  greenGlow.intensity = 0.4 + Math.sin(now * 0.0015) * 0.2;

  // Deck labels
  if (typeof _updateLabels === 'function') _updateLabels();


  if (screenMesh && state.trackLoaded) drawScreen();
  renderer.render(scene, camera);
}

// ── Deck labels — fixed offsets from 3D anchors, no drag, no reset ──
const _labelDefs = [
  { id: 'lbl-play',  getAnchor: () => playButton,      ox: -244, oy:  11 },
  { id: 'lbl-cue',   getAnchor: () => cueButton,       ox: -231, oy: -15 },
  { id: 'lbl-track', getAnchor: () => hitboxes['usb'], ox: -121, oy:  -8 },
  { id: 'lbl-usb',   getAnchor: () => usbMesh,         ox:  -32, oy: -168 },
];
// Drag for lbl-usb only (positioning mode)
(function() {
  const d = _labelDefs.find(x => x.id === 'lbl-usb');
  const el = document.getElementById('lbl-usb');
  let drag = false, sx = 0, sy = 0, sox = 0, soy = 0;
  el.addEventListener('mousedown', e => { e.stopPropagation(); drag=true; sx=e.clientX; sy=e.clientY; sox=d.ox; soy=d.oy; });
  document.addEventListener('mousemove', e => { if (!drag) return; d.ox=sox+(e.clientX-sx); d.oy=soy+(e.clientY-sy); });
  document.addEventListener('mouseup',   () => { drag=false; });
})();
function _updateLabels() {
  const W = window.innerWidth, H = window.innerHeight;
  _labelDefs.forEach(d => {
    const obj = d.getAnchor();
    if (!obj) return;
    const p  = obj.position.clone().project(camera);
    const el = document.getElementById(d.id);
    // camera.setViewOffset (when in crop mode) automatically maps NDC to the
    // cropped viewport — labels land in the correct position with no extra math.
    el.style.left = (d.id === 'lbl-usb'
      ? (W / 2 - el.offsetWidth / 2)
      : ((p.x * 0.5 + 0.5) * W + d.ox)) + 'px';
    el.style.top  = ((1 - (p.y * 0.5 + 0.5)) * H + d.oy) + 'px';
  });
}

animate();

// ── Screen off: save position and pause cleanly; screen on: resume on touch ──
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state.audioCtx && state.playing) {
    // Save live position before stopping
    state.pauseOffset = getPos();
    // Tiny gain ramp to silence before stopping — avoids click
    const ctx = state.audioCtx;
    const now = ctx.currentTime;
    state.gainNode.gain.cancelScheduledValues(now);
    state.gainNode.gain.setValueAtTime(state.gainNode.gain.value, now);
    state.gainNode.gain.linearRampToValueAtTime(0, now + 0.04);
    setTimeout(() => {
      try { state.sourceNode.stop(); } catch(e) {}
      // Restore gain for next play
      state.gainNode.gain.cancelScheduledValues(ctx.currentTime);
      state.gainNode.gain.setValueAtTime(1, ctx.currentTime);
    }, 60);
    state.playing = false;
    updatePills();
  }
});
// iOS won't resume AudioContext without a real user gesture — hook every touch
document.addEventListener('touchstart', () => {
  if (state.audioCtx && state.audioCtx.state === 'suspended') state.audioCtx.resume();
}, { passive: true });

// ── Keyboard ──
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'KeyC') pressCue();
  if (e.code === 'ArrowLeft') seekTo(Math.max(0, getCurrentTime() - 5) / state.duration);
  if (e.code === 'ArrowRight') seekTo(Math.min(state.duration, getCurrentTime() + 5) / state.duration);
});

// ── Resize ──
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (CROP_MODE) {
    _applyCrop();
  } else {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
});
// Apply crop on first load if in crop mode
if (CROP_MODE) { _applyCrop(); }
</script>

<!-- ── Symmetric framing rectangle ── -->
<style>
  #sym-rect-layer {
    position: fixed; inset: 0; z-index: 9990;
    pointer-events: none;
  }
  #sym-rect {
    position: absolute;
    border: 1.5px solid rgba(255,255,255,0.85);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
    background: transparent;
    pointer-events: none;
  }
  .sym-handle {
    position: absolute;
    width: 10px; height: 10px;
    border: 1.5px solid #fff;
    background: rgba(0,0,0,0.5);
    pointer-events: auto;
  }
  /* corner positions */
  .sym-handle.tl { top:-5px;  left:-5px;  cursor:nwse-resize; }
  .sym-handle.tr { top:-5px;  right:-5px; cursor:nesw-resize; }
  .sym-handle.bl { bottom:-5px; left:-5px;  cursor:nesw-resize; }
  .sym-handle.br { bottom:-5px; right:-5px; cursor:nwse-resize; }
  #sym-lock-btn {
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    z-index:9991; background:#000; border:1px solid #fff;
    color:#fff; font-family:-apple-system,sans-serif;
    font-size:9px; letter-spacing:3px; text-transform:uppercase;
    padding:8px 20px; cursor:pointer;
  }
  #sym-lock-btn:hover { background:#fff; color:#000; }
  #sym-lock-output {
    position:fixed; bottom:70px; left:50%; transform:translateX(-50%);
    z-index:9991; background:#000; border:1px solid #1a5c2a;
    color:#00ff41; font-family:monospace; font-size:10px;
    padding:12px 16px; white-space:nowrap; display:none;
    letter-spacing:1px;
  }
</style>

<div id="sym-rect-layer">
  <div id="sym-rect">
    <div class="sym-handle tl" data-corner="tl"></div>
    <div class="sym-handle tr" data-corner="tr"></div>
    <div class="sym-handle bl" data-corner="bl"></div>
    <div class="sym-handle br" data-corner="br"></div>
  </div>
  <button id="sym-lock-btn">LOCK CROP</button>
  <div id="sym-lock-output"></div>
</div>

<script>
(function() {
  // Only show the framing tool when explicitly requested (?frame in URL)
  const FRAME_MODE = _urlP.has('frame');
  if (!FRAME_MODE) {
    document.getElementById('sym-rect-layer').style.display = 'none';
    return;
  }

  const box = document.getElementById('sym-rect');

  // State — centred on vertical axis, aspect-ratio locked after first drag
  let halfW      = 220;
  let rectTop    = window.innerHeight / 2 - 140;
  let rectBottom = window.innerHeight / 2 + 140;
  let aspectRatio = null; // locked on first drag release

  function getW()  { return halfW * 2; }
  function getH()  { return rectBottom - rectTop; }

  function render() {
    const cx = window.innerWidth / 2;
    box.style.left   = (cx - halfW) + 'px';
    box.style.top    = rectTop + 'px';
    box.style.width  = getW() + 'px';
    box.style.height = getH() + 'px';
  }

  let drag = null;

  document.querySelectorAll('.sym-handle').forEach(h => {
    h.addEventListener('mousedown', e => {
      e.stopPropagation();
      drag = {
        corner: h.dataset.corner,
        sx: e.clientX, sy: e.clientY,
        initHalfW: halfW,
        initTop: rectTop,
        initBottom: rectBottom,
        initAR: aspectRatio
      };
    });
  });

  window.addEventListener('mousemove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.sx;
    const dy = e.clientY - drag.sy;
    const c  = drag.corner;

    // X always symmetric — right corners grow right, left corners grow left
    if (c === 'tr' || c === 'br') {
      halfW = Math.max(20, drag.initHalfW + dx);
    } else {
      halfW = Math.max(20, drag.initHalfW - dx);
    }

    // Y — top corners move top edge only, bottom corners move bottom edge only
    if (c === 'tl' || c === 'tr') {
      rectTop = Math.min(drag.initBottom - 20, drag.initTop + dy);
    } else {
      rectBottom = Math.max(drag.initTop + 20, drag.initBottom + dy);
    }

    render();
  });

  window.addEventListener('mouseup', () => { drag = null; });

  // LOCK CROP button
  document.getElementById('sym-lock-btn').addEventListener('click', () => {
    const W  = window.innerWidth, H = window.innerHeight;
    const cx = W / 2;
    const rx = cx - halfW, ry = rectTop, rw = getW(), rh = getH();
    const nx = +(rx / W).toFixed(5);
    const ny = +(ry / H).toFixed(5);
    const nw = +(rw / W).toFixed(5);
    const nh = +(rh / H).toFixed(5);
    const ar = +(W / H).toFixed(5);
    const pbPct = +((rh / rw) * 100).toFixed(3); // rect height/width ratio
    const cropStr = `${nx},${ny},${nw},${nh},${ar}`;
    const out = document.getElementById('sym-lock-output');
    out.innerHTML =
      `crop params: <b>${cropStr}</b><br>` +
      `iframe padding-bottom: <b>${pbPct}%</b><br>` +
      `<span style="color:#fff;font-size:9px">tell claude to lock these in</span>`;
    out.style.display = 'block';
    console.log('CROP LOCK:', cropStr, '| padding-bottom:', pbPct + '%');
  });

  render();
})();
</script>
